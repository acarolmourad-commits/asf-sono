<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ASF Sono — Sono e recuperação para surfar melhor | ASF</title><meta name="description" content="Rastreador de sono e recuperação para surfistas: registre suas noites e veja como o sono afeta sua performance no mar. Satélite do app ASF."><link rel="canonical" href="https://acarolmourad-commits.github.io/asf-sono/"><meta name="theme-color" content="#00A8CC"><style>:root{--p:#00A8CC;--d:#0E2439;--u:#9B59B6;--bg:#F7FBFC;--g:#5A6B7A}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--d)}nav{position:sticky;top:0;background:#fff;border-bottom:1px solid #E5EEF2;padding:10px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}nav a{color:var(--p);text-decoration:none;font-weight:700;font-size:13px}nav a.on{color:var(--u)}header{background:linear-gradient(135deg,#0E2439,var(--u));color:#fff;padding:40px 20px 30px;text-align:center}.wrap{max-width:640px;margin:0 auto;padding:24px 16px 60px}.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(14,36,57,.06)}.card h2{font-size:15.5px;margin-bottom:8px}.row{display:flex;gap:10px;align-items:center}input[type=number],select{padding:9px;border:2px solid var(--p);border-radius:10px;font-size:15px;width:90px}button.salvar{background:linear-gradient(135deg,var(--p),var(--u));color:#fff;border:0;padding:10px 18px;border-radius:999px;font-weight:700;cursor:pointer}.bars{display:flex;gap:6px;align-items:flex-end;height:80px;margin-top:10px}.bars div{flex:1;background:linear-gradient(180deg,var(--p),var(--u));border-radius:4px 4px 0 0;min-height:4px}.muted{color:var(--g);font-size:12.5px}footer{text-align:center;font-size:12.5px;color:var(--g);padding:24px;border-top:1px solid #E5EEF2}</style></head><body><nav><a href="https://acarolmourad-commits.github.io/asf-app/">🏄 App</a><a class="on" href="https://acarolmourad-commits.github.io/asf-sono/">😴 Sono</a><a href="https://acarolmourad-commits.github.io/asf-bemestar/">🧘 Bem-estar</a><a href="https://acarolmourad-commits.github.io/asf-treino/">🏋️ Treino</a><a href="https://acarolmourad-commits.github.io/asf-mental/">🧠 Mental</a></nav><header><h1>😴 Sono da surfista</h1><p>Registre suas noites e descubra o quanto o sono rende no mar.</p></header><main class="wrap"><div class="card"><h2>Como foi a noite?</h2><div class="row"><input type="number" id="h" min="0" max="14" step="0.5" placeholder="Horas"> <select id="q"><option value="1">Ruim</option><option value="2" selected>Ok</option><option value="3">Ótima</option></select> <button class="salvar" onclick="salvar()">Registrar</button></div></div><div class="card"><h2>Últimas 7 noites</h2><div class="bars" id="bars"></div><div class="muted" id="msg">Registre a primeira noite acima.</div></div><p class="muted">Boa recuperação também passa por <a href="https://acarolmourad-commits.github.io/asf-nutricao/" style="color:var(--p)">nutrição</a> e <a href="https://acarolmourad-commits.github.io/asf-yoga/" style="color:var(--p)">yoga</a>.</p></main><footer>🌊 ASF · <a href="https://acarolmourad-commits.github.io/" style="color:var(--p)">Hub de apps</a></footer><script>const K='asf-sono-v1';let d=JSON.parse(localStorage.getItem(K)||'[]');function render(){const b=document.getElementById('bars');b.innerHTML='';d.slice(-7).forEach(x=>{const el=document.createElement('div');el.style.height=(x.h/10*100)+'%';el.title=x.h+'h ('+['ruim','ok','ótima'][x.q-1]+')';b.appendChild(el);});if(d.length){const m=d.slice(-7).reduce((s,x)=>s+x.h,0)/Math.min(7,d.length);document.getElementById('msg').textContent='Média: '+m.toFixed(1)+'h por noite '+(m>=8?'— recuperação excelente! 🌟':m>=7?'— boa, dá para melhorar 💪':'— atenção: sono curto derruba performance ⚠️');}}function salvar(){const h=parseFloat(document.getElementById('h').value);if(!h)return;d.push({h:Math.min(14,h),q:+document.getElementById('q').value});localStorage.setItem(K,JSON.stringify(d));render();}render();</script></body></html>
